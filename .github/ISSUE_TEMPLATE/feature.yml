name: Proposer une amélioration
description: Proposer une nouvelle fonctionnalité ou une amélioration de l'expérience.
title: "[Idée] "
body:
  - type: markdown
    attributes:
      value: |
        Décrivez surtout le besoin et le contexte d'usage. Le dépôt est public : aucune donnée personnelle ne doit être publiée.
  - type: textarea
    id: need
    attributes:
      label: Quel besoin cherchez-vous à résoudre ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Quelle amélioration imaginez-vous ?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Partie de Check Mate concernée
      options:
        - Application parent
        - Application enfant
        - Checkmate Lite
        - Alexa
        - Nestor
        - Récompenses et points
        - Tâches et routines
        - Autre
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte d'usage
      description: Expliquez quand et pourquoi cette amélioration serait utile, sans données personnelles.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: J'ai vérifié que cette proposition ne contient aucune donnée personnelle, donnée d'enfant, photo privée ou secret.
          required: true
