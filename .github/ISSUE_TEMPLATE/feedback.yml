name: Autre feedback
description: Partager un retour qui n'est ni un bug ni une demande de fonctionnalité.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Merci. Ce dépôt est public : anonymisez toujours votre retour.
  - type: textarea
    id: feedback
    attributes:
      label: Votre retour
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Partie concernée
      options:
        - Application parent
        - Application enfant
        - Checkmate Lite
        - Alexa
        - Nestor
        - Autre
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: J'ai vérifié que ce retour ne contient aucune donnée personnelle, donnée d'enfant, photo privée ou secret.
          required: true
