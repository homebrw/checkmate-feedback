name: "✨ Partager un retour de bêta-test"
description: "Un bug, une idée ou juste quelque chose qui vous a surpris : racontez-nous."
title: "[Bêta] "
body:
  - type: markdown
    attributes:
      value: |
        ## Merci de tester Check Mate 💛

        Pas besoin de vocabulaire technique ni de savoir si c'est vraiment un bug.
        **Racontez simplement ce que vous avez fait et ce que vous avez remarqué.**

        **Pour le titre**, quelques mots suffisent, par exemple : « le bouton de validation ne réagit pas ».

        Les champs facultatifs peuvent être laissés vides.

        > 🔒 Ce dépôt est public. N'indiquez aucun nom complet, e-mail, téléphone, adresse, mot de passe, donnée permettant d'identifier un enfant, ni capture contenant des informations personnelles.

  - type: dropdown
    id: space
    attributes:
      label: "🧭 Quelle partie de Check Mate utilisiez-vous ?"
      description: "Si vous testez avec un enfant, un adulte peut remplir ce formulaire en reprenant ses mots."
      options:
        - Espace parent
        - Espace enfant
        - Les deux ensemble
    validations:
      required: true

  - type: dropdown
    id: feedback_type
    attributes:
      label: "💬 Qu'avez-vous envie de nous dire ?"
      options:
        - "🐛 Quelque chose ne fonctionne pas"
        - "😕 Quelque chose est difficile à comprendre"
        - "✨ Quelque chose pourrait être plus simple ou plus agréable"
        - "💡 J'ai une idée"
        - "❤️ J'aime quelque chose et je veux le dire"
        - "📝 Autre retour"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: "📍 Où cela se passe-t-il ?"
      description: "Choisissez ce qui ressemble le plus à l'endroit concerné."
      options:
        - Accueil
        - Tâches et routines
        - Points et récompenses
        - Nestor
        - Alexa
        - Réglages
        - Check Mate Lite
        - Connexion / compte
        - Notifications
        - Autre
        - Je ne sais pas
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: "✍️ Racontez-nous"
      description: "Une ou deux phrases suffisent. Qu'avez-vous voulu faire ? Qu'avez-vous vu, compris ou ressenti ?"
      placeholder: |
        Exemple : J'ai voulu valider une tâche. J'ai appuyé sur le bouton, mais je ne savais pas si ça avait marché parce que rien n'a changé à l'écran.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "🎯 Qu'auriez-vous aimé qu'il se passe ?"
      description: "Facultatif. Dites-nous ce qui vous aurait semblé plus clair, plus simple ou plus logique."
      placeholder: "Exemple : j'aurais aimé voir tout de suite un message disant que la tâche était bien envoyée."

  - type: textarea
    id: steps
    attributes:
      label: "👣 Si c'est un bug, comment peut-on le revoir ?"
      description: "Facultatif. Même deux étapes peuvent beaucoup aider."
      placeholder: |
        1. J'ouvre…
        2. J'appuie sur…
        3. Puis…

  - type: dropdown
    id: frequency
    attributes:
      label: "🔁 Si c'est un bug, cela arrive…"
      options:
        - À chaque fois
        - Souvent
        - Une seule fois
        - Je ne sais pas

  - type: input
    id: device
    attributes:
      label: "📱 Appareil ou navigateur"
      description: "Facultatif. Laissez vide si vous ne savez pas."
      placeholder: "Exemple : iPhone + Safari, Android + Chrome, ordinateur, Alexa…"

  - type: textarea
    id: screenshot
    attributes:
      label: "📸 Capture d'écran ou vidéo"
      description: "Facultatif. Masquez toute information personnelle ou familiale avant de l'ajouter. En cas de doute, n'ajoutez pas de capture."
      placeholder: "Glissez votre capture ici si elle aide à comprendre."

  - type: checkboxes
    id: privacy
    attributes:
      label: "🔒 Avant d'envoyer"
      options:
        - label: "J'ai vérifié qu'il n'y a aucune information personnelle, donnée permettant d'identifier un enfant, ni secret dans ce retour ou ses captures."
          required: true
